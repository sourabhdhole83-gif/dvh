spring:
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns schema changes; Hibernate only checks the mappings
    show-sql: true         # print executed SQL to the console
  flyway:
    baseline-on-migrate: true # Preserve an existing non-empty development schema
    baseline-version: 1

logging:
  level:
    com.dvh: debug         # detailed logs for application code