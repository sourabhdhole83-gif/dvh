# application-dev.yaml (sirf development ke liye, base file ke upar override hota hai)
spring:
  jpa:
    show-sql: true                              # console me SQL print hoti rahegi, debugging me kaam aati hai

logging:
  level:
    com.dvh: debug                              # apne code ke detailed logs dikhenge

springdoc:
  api-docs:
    enabled: true                               # OpenAPI JSON /v3/api-docs pe milega
  swagger-ui:
    enabled: true                               # Swagger UI se browser me API test kar sakte ho