spring:
  jpa:
    show-sql: false                # SQL print nahi hogi
  web:
    error:
      include-stacktrace: never    # stacktrace client tak nahi jayega
      include-message: never       # error message bhi client tak nahi jayega

logging:
  level:
    com.dvh: info                  # sirf important logs

springdoc:
  api-docs:
    enabled: false                 # prod me API docs band
  swagger-ui:
    enabled: false                 # prod me Swagger UI band