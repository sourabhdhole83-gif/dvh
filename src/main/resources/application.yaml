spring:
  application:
    name: dvh                                   # application name
  config:
    import: optional:file:.env[.properties]     # load values from .env (no error if the file is missing)
  profiles:
    default: dev                                # profile used when none is specified
  datasource:
    url: ${DB_URL}                              # database URL, from .env
    username: ${DB_USERNAME:root}               # database user, defaults to root if not set
    password: ${DB_PASSWORD}                    # database password, from .env
  jpa:
    open-in-view: false                         # Session remains only up to the @Transactional service; no lazy loading in the controller

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7


server:
  port: 5555                                    # app runs on http://localhost:5555




